<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>狸花猫 · 蹲坐擦嘴逐帧预览</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f2eee6;color:#46382c}*{box-sizing:border-box}body{margin:0;padding:30px}main{max-width:1120px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:26px;margin:0 0 9px}p{font-size:13px;line-height:1.8;color:#7d6b59;margin:0}a{color:#806349;text-decoration:none;font-size:12px}.stage{margin-top:24px;display:grid;grid-template-columns:1fr 300px;gap:18px}.panel{border:1px solid #dccfbd;border-radius:14px;background:#fffaf2;overflow:hidden}.screen{background:#e5dfd3;display:flex;align-items:center;justify-content:center;min-height:410px}.screen canvas{image-rendering:pixelated;max-width:100%;height:auto}.small{height:230px;min-height:0}.panel h2{font-size:13px;margin:14px 18px}.small canvas{width:220px;height:176px}.explain{padding:16px 18px;font-size:12px;line-height:2;color:#77614d}.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px;padding:17px}button,select{font:inherit;font-size:12px;padding:8px 12px;border:1px solid #cebea8;background:#fffaf2;border-radius:7px;color:#57422e;cursor:pointer}button.primary{background:#5c4937;color:#fff;border-color:#5c4937}#status{padding:0 18px 19px;text-align:center;font-size:12px;color:#7b6148}.frames{margin-top:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.frame{border:2px solid transparent;background:#e5dfd3;border-radius:10px;overflow:hidden;cursor:pointer;padding:0}.frame.active{border-color:#8c6a48}.frame canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.frame span{display:block;padding:8px;font-size:11px;background:#fffaf2;color:#735e49}footer{font-size:12px;color:#806b55;line-height:1.8;margin-top:18px}.stepper{width:100%;accent-color:#7e6041}@media(max-width:800px){body{padding:18px}.stage{grid-template-columns:1fr}.screen{min-height:0}header{display:block}.frames{grid-template-columns:repeat(2,1fr)}}
</style>
<main><header><div><h1>坐稳，再抬爪擦嘴。</h1><p>基于蹲坐设定图的 8 张姿态预览 · 抬起画面左侧前爪 · 头部不侧歪</p></div><a href="review.html">← 返回角色四视图</a></header>
<section class="stage"><div class="panel"><div class="screen"><canvas id="large" width="495" height="396" aria-label="擦嘴动画预览"></canvas></div><div class="controls"><button class="primary" id="play">暂停</button><button id="restart">重播</button><button id="prev">上一帧</button><button id="next">下一帧</button><label><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">0.5 倍慢放</option></select></label></div><div id="status" role="status">正在加载动画…</div><input class="stepper" id="frame" type="range" min="0" max="7" step="1" value="0" aria-label="查看帧"></div>
<aside class="panel"><h2>桌面尺寸参考</h2><div class="screen small"><canvas id="small" width="495" height="396" aria-label="桌面大小动画"></canvas></div><div class="explain">两个后肢保持蹲坐。<br>画面右侧前爪持续支撑。<br>画面左侧前爪离地后，原落点空出。<br>同一只前爪抬起、碰嘴、擦过、落回。<br>闭眼只作为擦嘴后的自然反应。</div></aside></section>
<section class="frames" id="frames" aria-label="八张关键帧"></section><footer>这组擦嘴姿态已接入应用的完整喂食流程。切换到慢放或逐帧查看，可检查四肢、头部角度与支撑脚的位置。<br><a href="http://127.0.0.1:8770/">查看完整喂食与迈步转身 →</a><br><a href="wipe-keyframes.png" download>透明序列图 ↓</a> · <a href="wipe.json" download>帧序与时长 ↓</a></footer></main>
<script>
const labels=['坐稳','前爪离地','抬到胸前','碰到嘴边','擦过口鼻','收回胸前','前爪下落','落爪眨眼'];
const durations=[240,130,150,200,240,160,160,240],endPause=900;
const sheet=new Image(),large=document.querySelector('#large'),small=document.querySelector('#small'),slider=document.querySelector('#frame'),status=document.querySelector('#status');
const cards=labels.map((text,index)=>{const button=document.createElement('button');button.className='frame';button.setAttribute('aria-label',`查看第${index+1}帧：${text}`);const canvas=document.createElement('canvas');canvas.width=495;canvas.height=396;const label=document.createElement('span');label.textContent=`0${index+1} · ${text}`;button.append(canvas,label);document.querySelector('#frames').append(button);button.addEventListener('click',()=>{playing=false;current=index;elapsed=0;paint()});return{button,canvas}});
let loaded=false,playing=true,current=0,elapsed=0,last=0,speed=1;
function draw(canvas,index){const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,495,396);ctx.drawImage(sheet,(index%4)*495,Math.floor(index/4)*396,495,396,0,0,495,396)}
function paint(){if(!loaded)return;draw(large,current);draw(small,current);slider.value=current;document.querySelector('#play').textContent=playing?'暂停':'播放';status.textContent=`第 ${current+1} / 8 帧 · ${labels[current]} · 动作 ${durations.reduce((a,b)=>a+b,0)/1000} 秒`;cards.forEach(({button},index)=>button.classList.toggle('active',index===current))}
function tick(now){if(last&&playing&&loaded){elapsed+=(now-last)*speed;const hold=durations[current]+(current===7?endPause:0);if(elapsed>=hold){elapsed-=hold;current=(current+1)%8;paint()}}last=now;requestAnimationFrame(tick)}
sheet.onload=()=>{if(sheet.naturalWidth!==1981||sheet.naturalHeight!==793){status.textContent=`图集尺寸错误：${sheet.naturalWidth} × ${sheet.naturalHeight}`;playing=false;return}loaded=true;cards.forEach(({canvas},index)=>draw(canvas,index));paint()};sheet.onerror=()=>{status.textContent='素材加载失败，请检查 wipe-keyframes.png'};sheet.src='wipe-keyframes.png';
document.querySelector('#play').onclick=()=>{playing=!playing;elapsed=0;paint()};document.querySelector('#restart').onclick=()=>{current=0;elapsed=0;playing=true;paint()};document.querySelector('#prev').onclick=()=>{playing=false;current=(current+7)%8;elapsed=0;paint()};document.querySelector('#next').onclick=()=>{playing=false;current=(current+1)%8;elapsed=0;paint()};document.querySelector('#speed').onchange=event=>{speed=Number(event.target.value)};slider.oninput=()=>{playing=false;current=Number(slider.value);elapsed=0;paint()};requestAnimationFrame(tick);
</script>
</html>
