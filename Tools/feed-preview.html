<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>狸花猫 · 完整喂食动画</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#45372b;background:#eee9e0}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1100px;margin:auto}small{color:#8b755e;letter-spacing:3px;font-size:10px}h1{font-size:25px;margin:10px 0}p{font-size:13px;color:#7c6854;line-height:1.8}.screen{background:#f2f2f2;border:1px solid #d9cfbf;border-radius:14px;overflow:hidden;margin-top:22px}.screen img{width:100%;height:auto;display:block;image-rendering:pixelated;aspect-ratio:620/300}button,select{font:inherit;font-size:12px;padding:9px 14px;border:1px solid #d3c3ac;background:#fffaf2;color:#574431;border-radius:7px;cursor:pointer}button.primary{background:#5d4936;color:#fff}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:17px 0}.status{margin-left:auto;color:#77604a;font-size:12px}input{width:100%;accent-color:#866444}.stages{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 24px}.stages button{font-size:11px;padding:7px 10px}.stages button.active{background:#dfcbaa;border-color:#bea37d}details{border-top:1px solid #d6c9b6;padding-top:18px}summary{font-size:13px;cursor:pointer;color:#735e49}details img{display:block;width:100%;margin-top:16px}footer{font-size:12px;line-height:1.8;color:#8a7158;margin-top:20px}a{color:#806048}label{font-size:12px}@media(max-width:640px){body{padding:18px}.status{margin-left:0;width:100%}}
.comparison{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.comparison figure{margin:0;background:#f2f2f2;border:1px solid #d9cfbf;border-radius:10px;overflow:hidden}.comparison figcaption{padding:12px;font-size:12px;text-align:center}.cat-crop{width:260px;height:232px;overflow:hidden;margin:auto}.cat-crop img{display:block;width:620px;height:300px;max-width:none;transform:translate(-340px,-60px);image-rendering:pixelated}.reference{height:232px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}.reference img{width:220px;height:176px;object-fit:contain;image-rendering:pixelated}.comparison[hidden]{display:none}@media(max-width:820px){.comparison{grid-template-columns:1fr}.comparison figure{max-width:340px;width:100%;margin:auto}}
@media(min-width:580px) and (max-width:820px){.comparison{grid-template-columns:repeat(2,minmax(0,1fr))}.comparison figure:first-child{grid-column:1/-1}.comparison figure{max-width:none}.comparison figure:first-child .reference{height:190px}}
</style><main><small>TABBY · FEEDING / MODEL V1</small><h1>从写下 Todo，到回到你身边。</h1><p>现有待机 → 打开便签坐下 → 完整投喂 → 坐着陪伴 → 关闭便签，恢复待机</p>
<div class="screen"><img id="frame" alt="狸花猫完整喂食动画" src="frames/0000.png"></div>
<div class="controls"><button class="primary" id="play">加载中…</button><button id="restart">从头播放</button><button id="turns">循环看转身</button><button id="prev">上一帧</button><button id="next">下一帧</button><label>速度 <select id="speed" aria-label="播放速度"><option value="1">正常</option><option value="0.5">半速检查</option></select></label><span class="status" id="status" role="status">加载应用渲染帧…</span></div>
<input id="scrub" type="range" min="0" max="1" value="0" step="1" aria-label="动画时间线"><div class="stages" id="stages"></div>
<section class="comparison" id="comparison" hidden aria-label="角色颜色同步对照">
<figure><figcaption>原定稿 · 身份与毛色基准</figcaption><div class="reference"><img src="original-approved.png" alt="用户选定的狸花猫原稿"></div></figure>
<figure><figcaption>修改前 · 与当前播放位置同步</figcaption><div class="cat-crop"><img id="beforeFrame" alt="修改前的同一帧"></div></figure>
<figure><figcaption>本次修正 · 与上方动画同步</figcaption><div class="cat-crop"><img id="afterFrame" alt="修正后的同一帧"></div></figure>
</section>
<details><summary>查看完整动作分镜</summary><img src="feed-steps.png" alt="完整喂食流程的十六张分镜"></details>
<footer>这里播放的是桌宠应用实际渲染并导出的画面。可跳转到任一动作，或用半速检查衔接。<br><a href="journey.gif" download>下载从待机到投喂再恢复的 GIF</a></footer></main>
<script>
const names={IdleBefore:'已有待机',EnterAwait:'打开便签坐下',AwaitBefore:'等待写 Todo',AwaitAfter:'完成后继续陪伴',ExitAwait:'关闭便签起身',IdleAfter:'恢复已有待机',FeedStart:'纸条变卡片',Rise:'起身',CatchCard:'跳起衔住',Settle:'落地坐稳',Eat:'咀嚼',Swallow:'吞咽',WipeMouth:'单爪擦嘴',StandAfterWipe:'擦完起身',TurnBack:'转背',Poop:'拉粑粑',ReturnFront:'转回来',Proud:'坐下眨眼'};
const frame=document.querySelector('#frame'),scrub=document.querySelector('#scrub'),play=document.querySelector('#play'),status=document.querySelector('#status');
let frames=[],images=[],beforeImages=[],index=0,elapsed=0,last=0,speed=1,playing=false,stageButtons=[],loopStart=0,loopEnd=0;
const revision='coat-20261025-v8';
function show(){const item=frames[index];if(!item)return;frame.src=images[index].src;if(beforeImages.length){document.querySelector('#beforeFrame').src=beforeImages[index].src;document.querySelector('#afterFrame').src=images[index].src}scrub.value=index;play.textContent=playing?'暂停':'播放';status.textContent=`${names[item.section||item.state]||names[item.state]} · ${index+1} / ${frames.length} 帧`;for(const entry of stageButtons)entry.button.classList.toggle('active',entry.state===(item.section||item.state))}
function seek(value){index=Math.max(0,Math.min(frames.length-1,value));elapsed=0;show()}
function tick(now){if(last&&playing&&frames.length){elapsed+=(now-last)*speed;let changed=false;while(elapsed>=frames[index].duration*1000+(index===loopEnd?900:0)){elapsed-=frames[index].duration*1000+(index===loopEnd?900:0);index=index>=loopEnd?loopStart:index+1;changed=true}if(changed)show()}last=now;requestAnimationFrame(tick)}
async function loadComparison(){try{const response=await fetch('before/timeline.json',{cache:'no-store'});if(!response.ok)return;const baseline=await response.json();if(baseline.frames.length!==frames.length||baseline.frames.some((f,i)=>f.state!==frames[i].state||f.cel!==frames[i].cel))return;beforeImages=await Promise.all(baseline.frames.map(item=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src='before/'+item.file+'?v='+revision})));document.querySelector('#comparison').hidden=false;show()}catch(error){beforeImages=[]}}
async function init(){try{const timeline=await(await fetch('timeline.json',{cache:'no-store'})).json();frames=timeline.frames;scrub.max=frames.length-1;let loaded=0;images=await Promise.all(frames.map(item=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{loaded++;status.textContent=`加载 ${loaded} / ${frames.length} 帧`;resolve(image)};image.onerror=reject;image.src=item.file+'?v='+revision})));const states=[...new Set(frames.map(f=>f.section||f.state))];for(const state of states){const button=document.createElement('button');button.textContent=names[state];button.onclick=()=>{playing=false;seek(frames.findIndex(f=>(f.section||f.state)===state))};document.querySelector('#stages').append(button);stageButtons.push({state,button})}playing=true;show();requestAnimationFrame(tick);loadComparison()}catch(error){status.textContent='预览加载失败，请通过本地预览服务器打开此页面。'}}
play.onclick=()=>{playing=!playing;if(index<loopStart||index>loopEnd){loopStart=0;loopEnd=frames.length-1}elapsed=0;show()};document.querySelector('#restart').onclick=()=>{loopStart=0;loopEnd=frames.length-1;playing=true;seek(0)};document.querySelector('#turns').onclick=()=>{loopStart=frames.findIndex(f=>f.state==='TurnBack');loopEnd=frames.findIndex(f=>f.state==='Proud')-1;playing=true;seek(loopStart)};document.querySelector('#prev').onclick=()=>{playing=false;seek(index-1)};document.querySelector('#next').onclick=()=>{playing=false;seek(index+1)};document.querySelector('#speed').onchange=event=>{speed=Number(event.target.value)};scrub.oninput=()=>{playing=false;seek(Number(scrub.value))};init().then(()=>{loopEnd=frames.length-1});
</script></html>
